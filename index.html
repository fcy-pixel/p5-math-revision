<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>數學大冒險 ・ 分數訓練師 RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 頂部 HUD -->
  <header class="hud">
    <div class="hud-trainer">
      <div id="hud-avatar" class="hud-avatar"></div>
      <div class="hud-stats">
        <div class="hud-line"><span class="lv-chip">Lv.<b id="hud-level">1</b></span> <span class="coins">🪙 <b id="hud-coins">0</b></span></div>
        <div class="xp-bar"><div id="hud-xp" class="xp-fill"></div><span id="hud-xp-text" class="xp-text"></span></div>
      </div>
    </div>
    <div class="hud-right">
      <span class="badge-count">🎖️ <b id="hud-badges">0</b></span>
      <button id="sound-btn" class="icon-btn" title="音效開關">🔊</button>
      <button id="settings-btn" class="icon-btn" title="設定">⚙️</button>
    </div>
  </header>

  <div id="key-banner" class="banner hidden">
    尚未設定 Qwen API Key，AI 出題與批改可能無法使用。
    <a href="#" id="open-settings-link">前往設定</a>
  </div>

  <main>
    <!-- 大地圖（overworld） -->
    <section id="view-map" class="view active">
      <div class="world">
        <div class="sky"></div>
        <div class="sun">☀️</div>
        <div class="cloud c1">☁️</div>
        <div class="cloud c2">☁️</div>
        <div class="cloud c3">☁️</div>
        <div class="hills"></div>
        <div class="ground"></div>
        <div class="world-title">🗺️ 分數大陸</div>
        <div id="map-buildings" class="map-buildings"></div>
        <div id="map-avatar" class="map-avatar"></div>
      </div>
      <p class="map-hint">點擊道館開始冒險，收服精靈、贏取徽章、升級成為最強訓練師！</p>
    </section>

    <!-- 對戰 -->
    <section id="view-battle" class="view">
      <div class="battle-top">
        <button class="back-map text-btn">← 地圖</button>
        <h2 id="gym-title"></h2>
        <span id="q-difficulty" class="lv-chip"></span>
      </div>

      <!-- 戰鬥舞台 -->
      <div class="stage">
        <div class="stage-sky"></div>
        <div class="stage-grass"></div>
        <div class="monster-zone">
          <div id="monster-emoji" class="monster-sprite">❓</div>
          <div class="monster-shadow"></div>
        </div>
        <div class="stage-info">
          <div id="monster-name" class="monster-name"></div>
          <div id="badge-progress" class="badge-progress"></div>
        </div>
        <div id="stage-trainer" class="stage-trainer"></div>
      </div>

      <!-- 對話框：題目 -->
      <div class="dialog">
        <div id="q-text" class="q-text"></div>
        <div id="answer-area" class="answer-area"></div>
        <div id="hint-box" class="hint-box"></div>
        <div class="q-actions">
          <button id="hint-btn" class="text-btn">💡 提示</button>
          <button id="submit-btn" class="primary-btn">丟出精靈球 ⚪</button>
          <button id="next-btn" class="primary-btn hidden">繼續冒險 →</button>
        </div>
        <div id="q-feedback" class="feedback"></div>
      </div>

      <!-- 博士求助 -->
      <details class="prof-card">
        <summary>🧑‍🔬 問博士（不明白就問我）</summary>
        <div id="prof-log" class="prof-log">
          <div class="bubble assistant">我是數學博士！例如問「點樣通分？」我會教你。</div>
        </div>
        <div class="prof-input-row">
          <textarea id="prof-input" rows="1" placeholder="輸入問題，按 Enter 問博士"></textarea>
          <button id="prof-send" class="primary-btn">問</button>
        </div>
      </details>
    </section>

    <!-- 圖鑑 -->
    <section id="view-dex" class="view">
      <div class="battle-top">
        <button class="back-map text-btn">← 地圖</button>
        <h2>📖 精靈圖鑑</h2>
        <span class="lv-chip" id="dex-count"></span>
      </div>
      <div id="dex-grid" class="dex-grid"></div>
    </section>
  </main>

  <!-- 升級 -->
  <div id="levelup-modal" class="modal hidden">
    <div class="modal-box pop-box">
      <div class="big-emoji">⭐</div>
      <h3 id="levelup-text"></h3>
      <button id="levelup-ok" class="primary-btn">繼續！</button>
    </div>
  </div>

  <!-- 徽章 -->
  <div id="badge-modal" class="modal hidden">
    <div class="modal-box pop-box">
      <div class="big-emoji">🎖️</div>
      <p id="badge-text"></p>
      <button id="badge-ok" class="primary-btn">太好了！</button>
    </div>
  </div>

  <!-- 設定 -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-box">
      <h3>設定 Qwen API Key</h3>
      <p class="modal-note">
        於 <a href="https://dashscope.console.aliyun.com/" target="_blank" rel="noopener">阿里雲百煉 / DashScope</a>
        取得金鑰，只會存在你的瀏覽器。若伺服器已設後備金鑰，可留空。
      </p>
      <input id="api-key-input" class="text-input" type="password" placeholder="sk-..." />
      <div class="modal-actions">
        <button id="settings-close" class="text-btn">取消</button>
        <button id="settings-save" class="primary-btn">儲存</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
